target-version = "py311"
line-length = 100

[lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults (standard for FastAPI Depends)
    "B904",  # Within an except clause, raise exceptions with raise ... from
    "UP007", # Use `X | Y` for type annotations (kept compatible with 3.11)
]

[lint.isort]
known-first-party = ["app"]
